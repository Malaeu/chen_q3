name = "q3_lean_aristotle"
version = "0.1.0"
defaultTargets = ["Q3"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[require]]
name = "doc-gen4"
scope = "leanprover"
git = "https://github.com/leanprover/doc-gen4.git"
rev = "v4.24.0"

[[lean_lib]]
name = "Q3"
moreLeanArgs = ["-j", "1", "-s", "65536"]
globs = ["Q3", "Q3.Proofs.RouteB.+"]

[[lean_lib]]
name = "aristotle_output"
roots = ["aristotle_output"]

# A3_FLOOR standalone files in root (dependency chain: v22 → v20, v19)
[[lean_lib]]
name = "A3_FLOOR_v19_monotonicity"
roots = ["A3_FLOOR_v19_monotonicity"]

[[lean_lib]]
name = "A3_FLOOR_v20_bounds_core"
roots = ["A3_FLOOR_v20_bounds_core"]

[[lean_lib]]
name = "A3_FLOOR_v22_stage4_floor"
roots = ["A3_FLOOR_v22_stage4_floor"]
