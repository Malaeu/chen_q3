  <rect x="280" y="372" width="380" height="80" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="2.5"/>
  <text x="300" y="398" font-size="15" font-weight="700" fill="#be123c">УЗЕЛ · открыто · SIMPLE_EVEN:1 (MISMATCH)</text>
  <text x="300" y="420" font-size="15" fill="#111827">нули det_N вещественны, для каждого N</text>
  <text x="300" y="442" font-size="13" fill="#6b7280">выход дихотомный: да / нет</text>

  <!-- боковая справка -->
  <rect x="30" y="372" width="212" height="126" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="46" y="398" font-size="13" fill="#374151">провод = выход одного</text>
