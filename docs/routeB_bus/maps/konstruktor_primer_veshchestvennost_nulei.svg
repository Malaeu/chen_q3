  <text x="46" y="438" font-size="13" fill="#374151">входом другого;</text>
  <text x="46" y="458" font-size="13" fill="#374151">сверяет компилятор</text>
  <text x="46" y="478" font-size="13" fill="#374151">Lean (harness)</text>

  <line x1="470" y1="452" x2="470" y2="484" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- СТАНОК Б (доказано) -->
  <rect x="280" y="488" width="380" height="84" rx="12" fill="#d9f2ee" stroke="#0f766e" stroke-width="2.5"/>
  <text x="300" y="514" font-size="15" font-weight="700" fill="#0f766e">СТАНОК Б · доказано · Гурвиц-мост</text>
  <text x="300" y="536" font-size="15" fill="#111827">предел функций с вещественными нулями</text>
  <text x="300" y="558" font-size="13" fill="#6b7280">(det_N → Ξ) · CanonicalRHRouteSkeleton.lean:145 · G7 условный</text>

  <line x1="470" y1="572" x2="470" y2="604" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- МОСТ (доказано) -->
  <rect x="280" y="608" width="380" height="64" rx="12" fill="#d9f2ee" stroke="#0f766e" stroke-width="2.5"/>
  <text x="300" y="634" font-size="15" font-weight="700" fill="#0f766e">МОСТ · доказано · ClassicalXiInterface.lean</text>
  <text x="300" y="656" font-size="15" fill="#111827">все нули Ξ вещественны ⟺ RH</text>

  <line x1="470" y1="672" x2="470" y2="704" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- RH (справка) -->
  <rect x="330" y="708" width="280" height="48" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="350" y="738" font-size="15" font-weight="700" fill="#374151">RH · справка — не заявляем (NOT_RH)</text>

  <text x="30" y="786" font-size="13" fill="#6b7280">⟵ Зум-аут: Route B · условная крыша (A ∧ B ∧ C) ⇒ RH · статус: CHALLENGER / NOT_RH</text>
</svg>
