    canonical_knowledge_db: q3.lean.aristotle/aristotle_db/knowledge.db
    canonical_proof_db: q3.lean.aristotle/aristotle_db/aristotle_proofs.db

  - id: routeb-outside-every-build-target
    status: RESOLVED
    discovered: 2026-08-12
    resolved: 2026-08-29
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    path: q3.lean.aristotle/lakefile.toml
    finding: >-
      `lake build Q3` does not build RouteB. It builds the cone of the root module Q3.lean,
      which has nineteen imports and reaches none of Q3/Proofs/RouteB. A full run of 7817
      jobs completed successfully without the string RouteB appearing once in its log.
      The lean_lib declares `globs = ["Q3"]`, and in Lake a bare module name is that one
      module, not the subtree; the subtree would be `Q3.+`.
    consequence: >-
      Of 204 RouteB source modules, 35 had .olean files on 2026-08-12. Those 35 were built
      by being named explicitly at some earlier point. The other 169 had never been compiled
      by any target, so no green build ever covered them and nothing said so.
    why_it_matters: >-
      A successful `lake build` is read as "the tree compiles". For RouteB it means nothing
      of the kind. Any tool that consumes compiled output — the environment dumper, an axiom
      audit, a comparator — silently sees a third of the tree and reports green over it.
      This is the same shape as the CvS map that read authoritative while nine days stale:
      the artefact is not wrong, it answers a narrower question than the reader assumes.
    verified_by: >-
      Q3.lean contains no RouteB import (rg, zero hits). build log of 7817 jobs contains no
      RouteB (rg -c, zero hits). `lake build Q3.Proofs.RouteB.CCMFiniteWeilParity` produced
      the missing .olean in 6.3 s, so the modules compile; they were simply never asked for.
    cost: >-
      About six seconds per module with Mathlib already built, so the backlog is minutes,
      not hours.
    remedy_taken: >-
      Modules built by explicit name, one per invocation, failures recorded per module.
      The lakefile was NOT edited: it sits under the Codex control chain, and changing a glob
      would silently enrol files that have never compiled.
    remedy_deferred_until_2026_08_29: >-
      Changing `globs` would fix this permanently but needed an owner decision plus the Codex
      chain, because it changes what a green build asserts.  That decision was taken and the
      change landed; the paragraphs above describe the state before it and are kept as the
      record of the defect, not of the present tree.
    resolution: >-
      Commit `4811e460` (2026-08-29, workflow refactor Block E) set
      `globs = ["Q3", "Q3.Proofs.RouteB.+"]`, so the existing default target now covers the
      whole RouteB subtree without a second library or selector.  The combined graph was
      measured BEFORE the edit at commit `c0316cb8`: the explicit union of `Q3` and all 367
      tracked RouteB modules completed 8181 jobs in 882 s with status 0, against 7814 jobs
      for `Q3` alone.  A regression plant covers an existing RouteB module, a hypothetical
      nested module, and separately proves that bare `Q3` is not accepted as subtree
      coverage.  Report: `docs/Codex/REPORT_2026-08-29_workflow_refactor_blockE.md`.

  - id: primecert-museum
    status: RETIRED
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    path: q3.lean.aristotle/Q3/Proofs/PrimeCert
    trigger: Exact mechanism archaeology only; exclude from broad scans and builds.
    writes: false
    approval: NONE
    authority: READ_ONLY_MECHANISM_LIBRARY
    failure_mode: About 1.5 GB of generated certificates makes direct scans and verification operationally infeasible.
