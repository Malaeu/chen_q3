      - id: edge-ledger-ratio
        classification: MANUAL
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_DERIVED
        path: docs/routeB_bus/phase5_scripts/edge_ledger_ratio.py
        invoke: .venv/bin/python docs/routeB_bus/phase5_scripts/edge_ledger_ratio.py
        trigger: >-
          Explicit Goal 058 Probe 3 (ratio kill-test of wall B), Probe 2
          verdict-computation, and Probe 4 (ADDENDUM, normalized curvature
          kappa) request only, after edge-ledger-build has written
          docs/routeB_bus/phase5_scripts/out/edge_ledger.json; not part of
          any automatic startup or goal-close event.
        writes: true
        approval: TASK_SCOPED_OUTPUT_UNDER_docs_routeB_bus_phase5_scripts_out
        authority: FINITE_EVEN_SECTOR_RATIO_c_m_AND_KAPPA_DIAGNOSTIC_NOT_A_CERTIFICATE_NOT_RH
        records_to: [docs/routeB_bus/phase5_scripts/out/edge_ledger_ratio.json, docs/routeB_bus/phase5_scripts/out/edge_ledger_probe2_probe3.md]
        note: >-
          Reads edge-ledger-build's actual nested schema (schedule -> precision
          -> cell, xi1_pm_index/xi2_pm_index, bounds-dicts), not a flat record
          list. Probe 3: q_m(t) = L^{-1/2} sum (-1)^n xi_n e^{2*pi*i*n*t/L},
          xi = the lambda1 eigenvector (xi1_pm_index); |q_m(t)| is integrated
          against e^{sigma|t|} via a piecewise-analytic reformulation (an
          entire cos-series continuation R(x) of Re q_m, split at q_m's sign
          changes located by a float64/numpy pre-scan, never reported as a
          number) so acb.integral only ever sees analytic integrands; the
          pre-scan grid is doubled and the resulting M_m(sigma) compared
          (<1e-8 relative, else QUADRATURE_GRID_UNCONVERGED). Probe 2: c_m :=
          -(dlambda1/dL)_HF / edge_sq, c2_m analogously from lambda2's own
          eigenvector/edge_sq_2; HF/FD mismatch trusts edge-ledger-build's own
          frozen 6-sig-digit flag, cross-checked independently. Probe 4
          (ADDENDUM 2026-09-03, P_CURVATURE_SOURCE_1): kappa := -F''(0)/(2F(0))
          from the lambda1 eigenvector, all arb at the record's precision; a
          negative kappa at any schedule m is a hard stop (KAPPA_NEGATIVE),
          checked before any other Probe 4 arithmetic runs. dps=120 vs 240
          movement (Probes 2/3/4 alike) is judged with the SAME 8-sig-digit
          sig_agree() convention edge-ledger-build itself uses (not an
          invented threshold); a moved (m,N) is excluded from the schedule
          verdict and surfaced explicitly rather than silently dropped or
          silently used. A verdict that is UNRESOLVED purely because the main
          schedule isn't fully present is relabeled
