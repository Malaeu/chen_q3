idea_git:
  what: >
    «git для отката идей и находки развилок» (формулировка владельца) — связка из
    четырёх частей, каждая отвечает на свой вопрос. Собрана 2026-08-09.
  parts:
    - {file: docs/GENEALOGY.md,      answers: "ОТКУДА пришли — развилки с причинами, хронология линий"}
    - {file: docs/Progress_Log.md,   answers: "КУДА свернули — судовой журнал, 8 граф"}
    - {file: docs/cartographer/,     answers: "ЧТО есть — TOOLS.yaml + brief/cheap/atoms/inventory"}
    - {file: docs/GLOSSARY.md,       answers: "ЧТО значит знак — словарь для не-математика"}
    - {file: docs/RECORDING_RULES.md, answers: "КАК писать — правила для Codex и Claude"}
  historical_layer: q3.lean.aristotle/docs/INSIGHTS.md
  historical_note: >
    INSIGHTS начинался как лог, потом стал журналом «иголок» — что привело к прорыву
    и что привело к блокировке. Вёлся одним файлом сознательно. Причины там ЕСТЬ
    (92% развилок с числами), но найти их нельзя: 51763 строки без указателя.
    Урок: запись без указателя равна отсутствию записи.
  audit_2026_08_09:
    lines_scanned: 51763
    forks_found: 48
    reason_recorded: 44
    reason_lost: 4
    all_losses_were: "внешние вердикты, записанные одной буквой CHOSEN без аргумента"

journal:
