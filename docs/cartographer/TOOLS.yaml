  retrieval_and_memory:
    summary: Search accumulated knowledge before external search or object creation.
    front_door: supplier-preflight
    coverage: [ask.sh, scripts/supplier_preflight.py, scripts/search_external_lean.py, scripts/literature_discovery.py, docs/cartographer/lean_env/envdump.py, docs/cartographer/comparator/fit.py, orchestrator/kb.py, scripts/research_oracle.py, orchestrator/kb_migrate_*.py]
    tools:
      - id: ask-shelf
        classification: MANUAL
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: ask.sh
        invoke: ./ask.sh "<terms>"
        alternatives:
          - ./ask.sh --deep "<terms>"
          - ./ask.sh --deep --external-receipt <mode-0600-path-outside-repo> "<terms>"
        trigger: ABSENCE_OR_NEW_OBJECT and before external review/search.
        writes: false
        approval: NONE
        authority: SCOPED_FAST_OR_DEEP_SHELF_RETRIEVAL_NOT_GLOBAL_ABSENCE
        records_to: stdout
        outcomes: [HITS, INCOMPLETE_FAST_REQUIRES_DEEP, SHELF_ABSENCE, INCOMPLETE]
        note: >-
          Fast runs every exact shelf, one qmd search, and one 3-second external search.
          A fast miss is INCOMPLETE_FAST_REQUIRES_DEEP. Deep additionally runs one qmd
          vsearch, validates the machine-local semantic receipt/corpus/live collection
          read-only, and uses one 15-second external search or one exact secure supplied
          receipt. Only an all-green deep miss is SHELF_ABSENCE; it authorizes neither
          creation nor consumption and is never rendered as global semantic absence.
        failure_mode: >-
          Any missing/corrupt required shelf, undocumented command failure, stale or
          foreign semantic receipt, external denominator drift, malformed receipt, or
          timeout yields INCOMPLETE even when another layer returned candidates.
        last_verified: 2026-09-02 Phase C contract

      - id: supplier-preflight
        classification: MANUAL
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: scripts/supplier_preflight.py
        invoke: >-
          python3 scripts/supplier_preflight.py --query "<terms>"
          --candidate <supplier-declaration> --target <exact-target-declaration>
