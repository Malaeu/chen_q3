dynamic_queries:
  knowledge_counts: >-
    sqlite3 -readonly q3.lean.aristotle/aristotle_db/knowledge.db
    "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
  assembly_status: >-
    sqlite3 -readonly q3.lean.aristotle/aristotle_db/knowledge.db
    "SELECT chain,status,count(*) FROM assembly GROUP BY chain,status ORDER BY chain,status;"
  tool_file_census: >-
    find orchestrator scripts q3.lean.aristotle/scripts specs_docs .agents/skills -type f
    \( -name '*.py' -o -name '*.sh' -o -name 'SKILL.md' \)
  routeb_state: >-
    python3 q3.lean.aristotle/ACTIVE/requests/routeB_twolevel_spectral_ladder/routeb_status.py --check
  git_state: git branch --show-current && git status --short -uall

tool_lifecycle:
  birth: No tool is ENABLED until audience, trigger, mode, invocation, writes, approval, authority, validation, and records_to are present.
  use: last_verified changes only after the declared invocation actually runs.
  mutation: A reader never runs write variants; canonical writes require an active goal-scoped grant or an exact separate-action approval, and network writers retain their declared boundary.
  failure: Mark BROKEN or DEGRADED on the first reproducible failure and name the replacement or stop condition.
  retirement: Historical files remain searchable but cannot route a task.
  observer_copy: A machine-local codex_specs copy is independent observer evidence, never a Codex startup dependency or canonical execution path.

known_hazards:
  - id: tools-spec-stale
    status: DEGRADED
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    path: specs_docs/TOOLS_SPEC.md
    trigger: Historical archaeology only.
    writes: false
    approval: NONE
    authority: HISTORICAL_SNAPSHOT_NOT_RUNBOOK
    failure_mode: Contains obsolete SESSION_ENTRY, INSIGHTS, research-oracle, and entry-audit routing.

  - id: legacy-entry-audit
    status: BROKEN
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    path: specs_docs/entry_audit.sh
    trigger: NEVER
    writes: false
    approval: NONE
    authority: NONE
    failure_mode: Misdates SESSION_ENTRY and searches the retired bus/BUS_PROTOCOL.md path.

  - id: claude-control-surfaces
    status: DISCONNECTED
    audience: [CLAUDE_CODE]
    mode: EXTERNAL
    paths: [CLAUDE.md, q3.lean.aristotle/CLAUDE.md, ~/.claude]
    trigger: Controlled only by the independent Claude Code observer.
    writes: false
    approval: OWNER_CONTROLS_CLAUDE_SEPARATELY
    authority: NOT_CODEX_INPUT
    failure_mode: Importing these rules into Codex recreates a hidden second policy layer.

  - id: stale-step32-step33-skills
    status: BROKEN
    audience: [CODEX]
    mode: READ_ONLY
    paths: [.agents/skills/q3-step32-lean/SKILL.md, .agents/skills/q3-psdpd-step33-bootstrap/SKILL.md]
    trigger: NEVER_FOR_ROUTE_B
    writes: false
    approval: NONE
    authority: NONE
    failure_mode: Route into the dormant June Step33 contour and its stale monitor.

  - id: zero-byte-sqlite-decoys
    status: BROKEN
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    paths: [knowledge.db, orchestrator/knowledge.db, orchestrator/observability.db, orchestrator/state/observability.db, q3.lean.aristotle/aristotle_db/proofs.db]
    trigger: NEVER
    writes: false
    approval: NONE
    authority: NONE
    failure_mode: Empty files mimic canonical database names and falsely report that project memory is empty.
    canonical_knowledge_db: q3.lean.aristotle/aristotle_db/knowledge.db
    canonical_proof_db: q3.lean.aristotle/aristotle_db/aristotle_proofs.db

  - id: routeb-outside-every-build-target
    status: FINDING
    discovered: 2026-08-12
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    path: q3.lean.aristotle/lakefile.toml
    finding: >-
      `lake build Q3` does not build RouteB. It builds the cone of the root module Q3.lean,
      which has nineteen imports and reaches none of Q3/Proofs/RouteB. A full run of 7817
      jobs completed successfully without the string RouteB appearing once in its log.
      The lean_lib declares `globs = ["Q3"]`, and in Lake a bare module name is that one
      module, not the subtree; the subtree would be `Q3.+`.
    consequence: >-
      Of 204 RouteB source modules, 35 had .olean files on 2026-08-12. Those 35 were built
      by being named explicitly at some earlier point. The other 169 had never been compiled
      by any target, so no green build ever covered them and nothing said so.
    why_it_matters: >-
      A successful `lake build` is read as "the tree compiles". For RouteB it means nothing
      of the kind. Any tool that consumes compiled output — the environment dumper, an axiom
      audit, a comparator — silently sees a third of the tree and reports green over it.
      This is the same shape as the CvS map that read authoritative while nine days stale:
      the artefact is not wrong, it answers a narrower question than the reader assumes.
    verified_by: >-
      Q3.lean contains no RouteB import (rg, zero hits). build log of 7817 jobs contains no
      RouteB (rg -c, zero hits). `lake build Q3.Proofs.RouteB.CCMFiniteWeilParity` produced
      the missing .olean in 6.3 s, so the modules compile; they were simply never asked for.
    cost: >-
      About six seconds per module with Mathlib already built, so the backlog is minutes,
      not hours.
    remedy_taken: >-
      Modules built by explicit name, one per invocation, failures recorded per module.
      The lakefile was NOT edited: it sits under the Codex control chain, and changing a glob
      would silently enrol files that have never compiled.
    remedy_not_taken: >-
      Changing `globs` to `Q3.+` would fix this permanently and needs an owner decision plus
      the Codex chain, because it changes what a green build asserts.

  - id: primecert-museum
    status: RETIRED
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    path: q3.lean.aristotle/Q3/Proofs/PrimeCert
    trigger: Exact mechanism archaeology only; exclude from broad scans and builds.
    writes: false
    approval: NONE
    authority: READ_ONLY_MECHANISM_LIBRARY
    failure_mode: About 1.5 GB of generated certificates makes direct scans and verification operationally infeasible.
