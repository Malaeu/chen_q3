    status: ENABLED
    kind: ship-log
    path: docs/Progress_Log.md
    created: 2026-02-28, воскрешён 2026-08-09
    what: >
      Судовой журнал РАЗВИЛОК, не событий. Семь граф на запись: развилка ·
      выбрали · почему · что отвергли и почему · техника · следующий ход · адреса.
    rule: >
      Писать В МОМЕНТ ВЫБОРА, не постфактум. Через неделю причина не восстановима —
      проверено археологией июня 2026. Пустая графа «что отвергли и почему» —
      главный источник будущих раскопок.
    why: >
      Событий пишется много (INSIGHTS.md 51763 строки, 30 closeout, 49 report,
      69 goal, 75 answer), развилок — не пишется. Из-за этого летом 2026
