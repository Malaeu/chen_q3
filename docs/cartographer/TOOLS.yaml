# Q3/RH operational tool manifest.
# Policy lives in docs/CODEX_CONTROL.md. This file answers what exists,
# when it is used, what it writes, and where its result becomes durable.

schema: q3_tool_manifest.v2

meta:
  updated: 2026-08-10
  owner: OWNER
  canonical: docs/cartographer/TOOLS.yaml
  observer_copy: machine-local codex_specs/TOOLS.yaml if present
  observer_rule: NONAUTHORITATIVE_NOT_A_CODEX_STARTUP_DEPENDENCY
  repo: /Users/emalam/GitHub/rh_lean_01_2026
  canonical_branch: rh_clean
  policy: docs/CODEX_CONTROL.md
  session_router: q3.lean.aristotle/ACTIVE/SESSION_ENTRY.md
  generated_inventory: docs/TOOLS.md
  rule: An instrument absent from this manifest or its registered family is not routable.

status_semantics:
  values: [ENABLED, AVAILABLE, DEGRADED, DISCONNECTED, RETIRED, BROKEN, PLANNED]
  enabled: Verified and callable for the declared audience and mode.
  available: Callable, but outside the automatic Q3 contour.
  degraded: Callable with a named semantic or operational limitation.
  disconnected: Present on disk but not wired into the declared runtime.
  retired: Historical mechanism; never a live entry point.
  broken: Known reproducer fails; do not route.
  planned: Design only; no callable implementation exists.

mode_semantics:
  values: [READ_ONLY, WRITES_DERIVED, WRITES_CANONICAL, NETWORK_WRITE, EXTERNAL]
  read_only: May be used without a write authorization.
  writes_derived: Rebuilds non-authoritative projections or generated outputs.
  writes_canonical: Mutates tracked source, canonical project memory, or task state.
  network_write: Sends, publishes, downloads, or changes remote state.
  external: Belongs to another executor or runtime and is not a Codex startup input.

tool_contract:
  required_fields: [id, status, audience, mode, path_or_paths, invocation, trigger, writes, approval, authority, records_to, last_verified]
  validation: last_verified is accepted only after the declared invocation or a task-specific plant succeeds.
  family_rule: Family coverage permits discovery only; it never inherits ENABLED status into an uninspected script.

startup_contract:
  order:
    - docs/CODEX_CONTROL.md
    - q3.lean.aristotle/COGNITIVE_OPERATORS.md
    - q3.lean.aristotle/ACTIVE/SESSION_ENTRY.md
    - docs/cartographer/TOOLS.yaml
    - docs/Codex/CURRENT.md
    - task_local_physical_state
    - bash specs_docs/session_start.sh
  manifest_read:
    always: [meta, tool_contract, startup_contract, memory_event_routes, data_surfaces, known_hazards]
    on_task_match: [tool_families]
  validation:
    command: bash specs_docs/session_start.sh
    checks: [schema, required_sections, tool_contract_fields, codex_path_resolution, current_task_pointer]
    writes: false
  prohibition:
    - CLAUDE.md is not a Codex startup input.
    - A generated view never overrides physical task state.
    - An ENABLED label without audience, trigger, mode, and write contract is invalid.

memory_event_routes:
  SESSION_START:
    read: [startup_contract, data_surfaces, known_hazards]
    run: [codex-session-start]
    record: NONE

  ABSENCE_OR_NEW_OBJECT:
    condition: Before claiming absence, searching externally, or creating a replacement.
    run: [ask-shelf, kb-query]
    record: SEARCH_FLAGS in the artifact being produced anyway.

  THEOREM_SHAPE_FORK:
    condition: Branch selection, return to an old route, bisection, or strategy pivot.
    read: [docs/GENEALOGY.md, docs/Progress_Log.md, docs/RECORDING_RULES.md]
    run: [property-descent]
    record: One eight-field Progress_Log entry at selection time.
    durable_projection: journal_entry.kind=branch_decision at goal-close.

  EXTERNAL_VERDICT:
    condition: A route decision arrived from Proshka, Mythos, Claude, Aristotle, or another reviewer.
    record: Actor plus verbatim argument; a choice letter alone is invalid.

  ODDITY:
    condition: Unexpected numerical, structural, migration, startup, database, or tool observation.
    record: Observation, plausible readings, and the outcome that distinguishes them before explanation.

  NEGATIVE_CLOSE:
    condition: INCONCLUSIVE, WALL, or KILLED.
    record: Structured AUTOPSY lines and a kill row when the killed unit is reusable knowledge.

  EXPLORATION_CLOSE:
    run: [kb-canonical-write]
    record: One compact reviewed closeout; raw speculative cycles stay out of durable memory.

  GOAL_CLOSE:
    run: [knowledge-spine-goal-close]
    record:
      - SEARCH_FLAGS and AUTOPSY from task artifacts.
      - Progress_Log branch decisions into knowledge.db.
      - Verdict lessons, sensors, semantic index, and derived Spine views.
    ordering: Route state is updated last.
    delivery: Under a GOAL_SCOPED_OPERATIONAL_GRANT, commit named paths, pull --rebase, and push before advancing.

  TOOL_BIRTH:
    condition: Before a new helper, generator, skill, hook, or database writer becomes routable.
    require: [audience, trigger, mode, invocation, writes, approval, authority, validation, records_to]

  TOOL_FAILURE:
    condition: A registered invocation has a reproducible failure.
    record: Mark BROKEN or DEGRADED immediately with reproducer and replacement; file existence is not ENABLED.

data_surfaces:
  branch_journal:
    path: docs/Progress_Log.md
    authority: CANONICAL_BRANCH_RATIONALE
    contains: Eight-field decisions, including rejected alternatives and external arguments.
    retrieval: [ask.sh, q3_docs, Spine recent decisions, knowledge.db branch_decision projection]

  genealogy:
    path: docs/GENEALOGY.md
    authority: REVIEWED_HISTORICAL_TOPOLOGY
    trigger: Branch choice, route return, bisection, or archaeology.

  recording_rules:
    path: docs/RECORDING_RULES.md
    authority: CANONICAL_RECORDING_FORMAT

  historical_stream:
    path: q3.lean.aristotle/docs/INSIGHTS.md
    authority: HISTORICAL_EVENT_STREAM
    rule: Never read wholesale at startup; enter through an exact address or retrieval result.

  semantic_project_memory:
    path: q3.lean.aristotle/aristotle_db/knowledge.db
    authority: CANONICAL_PROJECT_SEMANTIC_MEMORY
    read_uri: file:q3.lean.aristotle/aristotle_db/knowledge.db?mode=ro
    owns: [kills, moves, reviewed_journal, branch_decisions, dossiers, search_flags]

  proof_artifact_registry:
    path: q3.lean.aristotle/aristotle_db/aristotle_proofs.db
    authority: METADATA_NOT_LEAN_TRUTH
    owns: [documents, lemmas, specifications, Aristotle provenance]

  observability_projection:
    path: q3.lean.aristotle/aristotle_db/observability.db
    authority: DERIVED_REGENERABLE_NOT_CANONICAL

  semantic_index:
    path: qmd://q3_docs/
    authority: RETRIEVAL_ONLY

tool_families:
  startup_and_control:
    summary: Read-only orientation and physical-state selection.
    front_door: codex-session-start
    coverage: [specs_docs/session_start.sh, orchestrator/spine.py, "**/routeb_status.py"]
    tools:
      - id: codex-session-start
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: specs_docs/session_start.sh
        invoke: bash specs_docs/session_start.sh
        trigger: Every Codex session in Q3.
        writes: false
        approval: NONE
        authority: ORIENTATION_AND_CONSISTENCY_CHECK
        records_to: NONE
        last_verified: 2026-08-10

      - id: knowledge-spine-strict
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/spine.py
        invoke: python3 orchestrator/spine.py --strict --stdout --reason session-start
        trigger: Internal check called once by codex-session-start; manual invocation is diagnostic only.
        writes: false
        approval: NONE
        authority: DERIVED_CONTROL_AND_MEMORY_VIEW
        records_to: stdout
        last_verified: 2026-08-10

      - id: knowledge-spine-goal-close
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_CANONICAL
        path: orchestrator/spine.py
        invoke: python3 orchestrator/spine.py --refresh --reason goal-close
        trigger: Closed goal after exact artifact validation.
        writes: true
        approval: TASK_SCOPE_MUST_ALREADY_AUTHORIZE_GOAL_CLOSE_WRITES
        authority: REGISTERED_GOAL_CLOSE_TRANSACTION_AND_DERIVED_VIEWS
        records_to: [knowledge.db, aristotle_proofs.db, inventory_RouteB.json, atoms_RouteB.json, observability.db, q3_docs, SPINE_STATE.json, SPINE_VIEW.md, META_CORPUS.json]
        last_verified: 2026-08-09

      - id: routeb-status
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: q3.lean.aristotle/ACTIVE/requests/routeB_twolevel_spectral_ladder/routeb_status.py
        invoke: python3 q3.lean.aristotle/ACTIVE/requests/routeB_twolevel_spectral_ladder/routeb_status.py --check
        trigger: Every Route B task.
        writes: false
        approval: NONE
        authority: OPERATIONAL_ADDRESS_CHECK_NOT_PROOF
        records_to: stdout
        last_verified: 2026-08-10

  retrieval_and_memory:
    summary: Search accumulated knowledge before external search or object creation.
    front_door: ask-shelf
    coverage: [ask.sh, orchestrator/kb.py, scripts/research_oracle.py, orchestrator/kb_migrate_*.py]
    tools:
      - id: ask-shelf
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: ask.sh
        invoke: ./ask.sh "<terms>"
        trigger: ABSENCE_OR_NEW_OBJECT and before external review/search.
        writes: false
        approval: NONE
        authority: CASCADED_MULTI_SURFACE_RETRIEVAL_WITH_SEMANTIC_FALLBACK
        records_to: stdout
        note: Fast structured and exact layers run first; q3_docs semantic search runs only when they are empty. A failed layer forbids an absence claim.
        last_verified: 2026-08-10

      - id: kb-query
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: orchestrator/kb.py
        invoke: ./orchestrator/kb.py ask "<terms>"
        alternatives: [flags, search, show, list, census, excluded]
        trigger: Exact project-memory query.
        writes: false
        approval: NONE
        authority: CANONICAL_PROJECT_SEMANTIC_MEMORY_READER
        records_to: stdout
        last_verified: 2026-08-09

      - id: kb-canonical-write
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_CANONICAL
        path: orchestrator/kb.py
        invoke: ./orchestrator/kb.py add ...
        alternatives: [record-exploration-close]
        trigger: Approved reusable kill or compact exploration close.
        writes: true
        approval: EXACT_WRITE_SCOPE
        authority: CANONICAL_PROJECT_SEMANTIC_MEMORY_WRITER
        records_to: q3.lean.aristotle/aristotle_db/knowledge.db
        last_verified: 2026-08-09

      - id: progress-log-migrator
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_CANONICAL
        path: orchestrator/kb_migrate_progress_log.py
        read_invoke: python3 orchestrator/kb_migrate_progress_log.py --dry-run
        write_invoke: python3 orchestrator/kb_migrate_progress_log.py
        trigger: GOAL_CLOSE through Spine; manual write only with exact approval.
        writes: true
        approval: GOAL_CLOSE_OR_EXACT_WRITE_SCOPE
        authority: IDEMPOTENT_BRANCH_DECISION_PROJECTION
        records_to: knowledge.db journal_entry
        last_verified: 2026-08-09

      - id: research-oracle
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: scripts/research_oracle.py
        invoke: python3 scripts/research_oracle.py query "<terms>" -c q3_docs
        trigger: Three to five semantic queries after exact target and consumer are named.
        writes: false
        write_variants: [ingest, add-speculative]
        approval: NONE_FOR_QUERY_EXACT_SCOPE_FOR_WRITE_VARIANTS
        authority: RETRIEVAL_ONLY
        records_to: stdout
        optional_corpus:
          id: erdos_minimum_overlap
          builder: q3.lean.aristotle/scripts/refresh_erdos_overlap_kb.py
          status: AVAILABLE
          trigger: Explicit external-methodology retrieval request only; never Q3 startup or goal close.
          safety: Stable collection root and incremental qmd embed; qmd embed -f is forbidden.
        last_verified: 2026-08-10

      - id: q3-docs-refresh
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_DERIVED
        path: q3.lean.aristotle/scripts/refresh_q3_docs.py
        invoke: python3 q3.lean.aristotle/scripts/refresh_q3_docs.py
        trigger: GOAL_CLOSE or explicit semantic-index refresh.
        writes: true
        approval: GOAL_CLOSE_OR_EXACT_WRITE_SCOPE
        authority: RETRIEVAL_INDEX_BUILDER
        records_to: qmd://q3_docs/
        last_verified: 2026-08-10

  cartography_and_property_descent:
    summary: Find capabilities by mathematical need, then descend suppliers to exact gaps.
    front_door: property-descent
    coverage:
      - docs/cartographer/*
      - machine-local codex_specs/cartographer/* as optional independent observer evidence
      - q3.lean.aristotle/aristotle_db/knowledge.db tables capability|assembly|contract2|counterexample|atom|atom_use
    workflow:
      - Name the exact target and terminal consumer.
      - Find candidate capability rows by provides/requires, not filename alone.
      - Descend every premise until READY, GAP, MISMATCH, OWNER_DATA, or NUMERIC.
      - Search bundle theorems before counting separate gaps.
      - Distinguish theorem existence from supplied hypotheses and object identity.
      - Record the selected branch and rejected alternatives in Progress_Log.
    tools:
      - id: property-descent
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: docs/cartographer/HOWTO.md
        invoke: Read HOWTO procedure, then query capability and assembly with sqlite mode=ro.
        trigger: Theorem-shape fork, forgotten mechanism, or supplier audit.
        writes: false
        approval: NONE
        authority: REVIEWED_CARTOGRAPHY_WORKFLOW
        records_to: stdout and Progress_Log when a route is selected
        note: Claude atomic-theorem-navigator is an external UI wrapper; Codex uses this registered workflow directly.
        last_verified: 2026-08-10

      - id: routeb-inventory
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_CANONICAL
        path: docs/cartographer/inventory.py
        invoke: python3 docs/cartographer/inventory.py --scope RouteB
        catalog_sync: python3 orchestrator/backfill_db.py --sync
        implementation: [docs/cartographer/inventory.py, orchestrator/backfill_db.py]
        cwd: repository root
        trigger: GOAL_CLOSE after Route B source changes, or explicit inventory/catalog refresh.
        writes: true
        approval: GOAL_SCOPED_OPERATIONAL_GRANT_OR_EXACT_OUTPUT_SCOPE
        authority: DETERMINISTIC_SOURCE_INVENTORY_AND_METADATA_INDEX_NOT_LEAN_TRUTH
        records_to: [inventory_RouteB.json, aristotle_proofs.db]
        last_verified: 2026-08-10

      - id: atom-index
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_DERIVED
        path: docs/cartographer/atoms.py
        invoke: python3 docs/cartographer/atoms.py docs/cartographer/atoms_RouteB.json
        cwd: repository root
        trigger: Explicit atom refresh after inventory changes.
        writes: true
        approval: EXACT_OUTPUT_SCOPE
        authority: DETERMINISTIC_EXTERNAL_ATOM_INDEX
        records_to: atoms_RouteB.json
        last_verified: 2026-08-10

      - id: route058-migrator
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_CANONICAL
        path: orchestrator/kb_migrate_route058.py
        invoke: python3 orchestrator/kb_migrate_route058.py --check
        cwd: repository root
        trigger: >-
          Checking whether the assembly chain still matches the master route; --write only when
          the route text itself changed.
        writes: true
        approval: EXACT_OUTPUT_SCOPE
        authority: ROUTE_TEXT_IS_THE_SOURCE_DB_IS_THE_PROJECTION
        failure_mode: >-
          --write replaces every row of its own chain and touches no other, so a stale script
          silently reverts hand edits made in the database. Edit the script, never the rows.
        records_to: knowledge.db table assembly, chain REALZERO_GROUND_DIAGONAL_TO_XI
        last_verified: 2026-08-12

      - id: map-coverage
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_DERIVED
        path: docs/cartographer/map_coverage.py
        invoke: python3 docs/cartographer/map_coverage.py
        cwd: repository root
        trigger: >-
          Before building anything new in RouteB, and after any file is added or renamed there.
        writes: true
        approval: EXACT_OUTPUT_SCOPE
        authority: FILE_INVENTORY_NOT_ROUTE_MAP
        measured_2026_08_11: 204 files, 20 named in MAP.md, 184 reachable only by knowing they exist
        failure_mode: >-
          The descriptor is the author's own header line, not a check of what the file proves.
          The appendix says which files exist, never which matter; MAP.md stays hand-written and
          is not touched by this tool.
        records_to: docs/routeB_bus/MAP_COVERAGE.md
        last_verified: 2026-08-11

      - id: comparator-lite
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_DERIVED
        path: docs/cartographer/comparator/
        invoke: see docs/cartographer/comparator/README.md ("Как прогнать заново")
        trigger: Manual invocation per docs/cartographer/comparator/README.md rerun section.
        writes: true
        approval: OWNER_PER_ACTION for any dispatch use; NONE for read-only rerun.
        authority: docs/CODEX_CONTROL.md
        records_to: docs/cartographer/comparator/README.md result section
        last_verified: >-
          2026-08-12 pilot run: Challenge PASS; Solution PASS with clean axioms;
          SolutionR6 REJECT.
        why: >-
          Answers the one question nothing in this project could answer: did the supplier
          prove the statement that was CLAIMED, or a neighbouring one. Name resolution and
          address checks both return OK on a wrong-but-adjacent theorem; only typechecking
          separates them.
        pattern_borrowed_from: >-
          anthropics/zeta-23-lean/comparator (Apache-2.0), who packaged their theorems for
          leanprover/comparator. The trusted-challenge / untrusted-solution SHAPE is
          borrowed; no code is copied.
        plants:
          - id: P1
            what: exact v3 supplier closes the challenge
            expected: PASS with axioms [propext, Classical.choice, Quot.sound]
            observed_2026_08_12: PASS
          - id: P2
            what: R6 wrapper, same name and same conclusion, stronger hypotheses
            expected: REJECTED
            observed_2026_08_12: >-
              REJECTED, exit 1. LipschitzOnWith K h (Ico 0 b) offered where LipschitzWith K h
              required; and `0 < a` at a = 0 left as an unprovable goal. Classification
              STRONGER_CLASS_REQUIRES_UNAVAILABLE_HYPOTHESES.
        kill_condition: >-
          If the R6 wrapper is ever accepted as closing the exact v3 target, the semantic
          layer of the constructor is dead and must not be extended. Not triggered.
        does_not: >-
          Not the full leanprover/comparator: no formal constant-set comparison between the
          two modules, no second kernel (nanoda), no sandbox. Does not implement the six
          project checks the judge requires on top of comparator — same source object, same
          scope, same normalization, same theorem direction, no hidden axiom, target not
          weakened. Those exist nowhere and must be written.
        toolchain_note: >-
          A full run needs lean4export built for leanprover/lean4:v4.26.0; comparator adopts
          the project's toolchain. Anthropic's tree is on v4.33.0-rc2.

      - id: lean-env-dump
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_DERIVED
        path: docs/cartographer/lean_env/envdump.py
        lean_source: docs/cartographer/lean_env/EnvDump.lean
        invoke: python3 docs/cartographer/lean_env/envdump.py
        alternatives:
          - python3 docs/cartographer/lean_env/envdump.py --prefix Q3.Proofs.RouteB.MuntzV3
          - python3 docs/cartographer/lean_env/envdump.py --namespace Q3.RouteB --out <path>
        why: >-
          Layer 1 of the constructor. atom_describe.py reads the source TEXT up to `:=` or
          `by`. That is enough for a human and not enough to decide applicability: the text
          carries no `section` variables, no implicit parameters, no universe parameters, no
          typeclass premises introduced by elaboration, no inserted coercions and no unfolded
          notation. The source of truth has to be the Lean environment. rg stays as the fast
          frontend; it stops being the judge.
        emits: >-
          JSON Lines, one record per declaration: name, kind, ELABORATED type, levelParams,
          numBinders, module, line, docstring, typeConsts, axiom closure, isPrivate, isUnsafe.
          typeConsts are the constants of the TYPE and are deliberately kept apart from the
          atoms of the proof body: the type carries the meaning of the statement, the body
          carries provenance and cost. Conflating them is what made foreign atom overlap a
          recall signal rather than a semantic bridge.
        coverage_denominator: >-
          Prints modules-with-source against modules-built on every run, and the uncovered
          count when they differ. A green report over a third of the tree reads as green over
          the whole tree unless the denominator is printed, so it is printed unconditionally.
        does_not: >-
          Judges nothing. It does not decide applicability, does not compare statements and
          does not rank candidates. It is an index, not a comparator. Applicability is layer 5
          and does not exist yet.
        limits: >-
          Sees only what is already compiled into .lake/build. Does not build Lean.
        first_payoff: >-
          The elaborated type of det_rankOneCorrection_diagonal_eq_neg_s_mul_lagrange shows
          `-s * SUM_k xi k * PROD_{j != k} (lam j - s)`, a sum of products, where the CvS step
          it was placed against needs `-s * PROD (lam j - s)`, a product. An adversarial pass
          had called that mismatch in prose; in the type it is visible at a glance. This is
          the check the regex layer could not perform.

      - id: atom-describe
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: WRITES_DERIVED
        path: docs/cartographer/atom_describe.py
        invoke: >-
          python3 docs/cartographer/atom_describe.py --limit 0
          --foreign /mnt/hdd01/Soft/GitHub/zeta-23-lean
          --json docs/cartographer/atoms_described.json
        alternatives:
          - python3 docs/cartographer/atom_describe.py --selftest
          - python3 docs/cartographer/atom_describe.py --bases
          - python3 docs/cartographer/atom_describe.py --chain <ASSEMBLY_CHAIN> --json <out>
        external_bases: >-
          Foreign Lean bases come from docs/cartographer/lean_bases.yaml, which carries an
          origin and a list of candidate paths per machine, so the same registry resolves on
          Linux and on the Mac. A missing base is reported on stderr with its clone URL rather
          than silently searched past. --foreign still works and is added to the registry
          rather than replacing it.
        selftest: >-
          --selftest runs the provenance classifier over fourteen names with known answers and
          exits nonzero on any miss. Three of them are cases where the classifier was wrong in
          an earlier revision, so the file is a regression record, not decoration.
        cwd: repository root
        trigger: Turning atom names into statements one can reason about or hand to an agent.
        writes: true
        approval: EXACT_OUTPUT_SCOPE
        authority: DECLARATION_LOOKUP_NOT_APPLICABILITY_JUDGEMENT
        failure_mode: >-
          A docstring is the author's paraphrase, not a check. The first version matched
          on the base name and returned `Real.pi` as a ContinuousMap product; full names
          are now compared against a reconstructed namespace stack.
        records_to: docs/cartographer/atoms_described.json
        last_verified: 2026-08-11

      - id: foreign-atom-bridge
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: docs/cartographer/foreign_atoms.py
        invoke: python3 docs/cartographer/foreign_atoms.py --foreign /mnt/hdd01/Soft/GitHub/zeta-23-lean
        cwd: repository root
        trigger: Locating a foreign formalization layer by topic.
        writes: false
        approval: NONE
        authority: NAME_INTERSECTION_ONLY
        failure_mode: >-
          Name intersection ranks shared foundations to the top (`Real.pi`, `mul_nonneg`)
          and does not separate relevant from incidental. What worked instead was
          searching foreign declarations by topic. See TRANSLATION_DICTIONARY.md.
        records_to: docs/cartographer/FOREIGN_LEAN_BRIDGE.md
        last_verified: 2026-08-11

      - id: constructor-probes
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: docs/cartographer/probes/
        invoke: lake env lean ../docs/cartographer/probes/<file>.lean
        cwd: q3.lean.aristotle
        trigger: Reproducing a claim recorded in a probe write-up; never part of a build.
        writes: false
        approval: NONE
        authority: SINGLE_EXPERIMENT_WITH_REGISTERED_OUTCOME
        registry: docs/cartographer/probes/README.md
        failure_mode: >-
          Run from the repository root instead of the package and toolchain v4.22.0 is
          picked up in place of v4.26.0; the probe dies on `unknown module prefix
          'Mathlib'` rather than on anything mathematical.
        negative_probes: >-
          Probe_ExactRecallFailure.lean must report exactly three `exact?` failures and
          Probe_TypedBridge_03_plant_standalone.lean must exit nonzero. A clean compile
          of either is a FAILURE of the probe, not a success; expected output is stated
          in each file header.
        records_to: docs/cartographer/probes/*.md and TRANSLATION_DICTIONARY.md
        last_verified: 2026-08-11

      - id: cheap-closure-finder
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: docs/cartographer/cheap.py
        invoke: python3 docs/cartographer/cheap.py
        cwd: repository root
        trigger: Prioritize non-READY assembly steps by closure cost.
        writes: false
        approval: NONE
        authority: HEURISTIC_QUEUE_NOT_PROOF
        records_to: stdout
        last_verified: 2026-08-10

      - id: cartographer-brief
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: docs/cartographer/brief.py
        invoke: python3 docs/cartographer/brief.py "<chain-prefix>"
        cwd: repository root
        trigger: Source-addressed state packet for local or external review.
        writes: false
        write_variant: --out writes the named packet and requires exact output approval.
        approval: NONE_FOR_STDOUT_EXACT_OUTPUT_SCOPE_FOR_OUT
        authority: DATABASE_DERIVED_BRIEF_NOT_PROOF
        records_to: stdout
        last_verified: 2026-08-10

      - id: cartographer-loaders
        status: DEGRADED
        audience: [HUMAN]
        mode: EXTERNAL
        paths:
          - machine-local codex_specs/cartographer/load_capability.py
          - machine-local codex_specs/cartographer/load_switches.py
          - machine-local codex_specs/cartographer/load_assembly.py
        invoke: External observer prepares a reviewed import packet; Codex does not execute these machine-local writers directly.
        trigger: Approved external import packet for reviewed lenses, switches, or assembly rows.
        writes: true
        approval: EXACT_DB_WRITE_SCOPE
        authority: EXTERNAL_IMPORTER_REQUIRES_PORT_OR_REVIEW
        records_to: q3.lean.aristotle/aristotle_db/knowledge.db
        failure_mode: Scripts and lens inputs live outside the canonical repo and contain a Mac-specific database path.
