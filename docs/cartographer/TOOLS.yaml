dynamic_queries:
  knowledge_counts: >-
    sqlite3 -readonly q3.lean.aristotle/aristotle_db/knowledge.db
    "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
  assembly_status: >-
    sqlite3 -readonly q3.lean.aristotle/aristotle_db/knowledge.db
    "SELECT chain,status,count(*) FROM assembly GROUP BY chain,status ORDER BY chain,status;"
  tool_file_census: >-
    find orchestrator scripts q3.lean.aristotle/scripts specs_docs .agents/skills -type f
    \( -name '*.py' -o -name '*.sh' -o -name 'SKILL.md' \)
  routeb_state: >-
    python3 q3.lean.aristotle/ACTIVE/requests/routeB_twolevel_spectral_ladder/routeb_status.py --check
  git_state: git branch --show-current && git status --short -uall

tool_lifecycle:
  birth: No tool is ENABLED until audience, trigger, mode, invocation, writes, approval, authority, validation, and records_to are present.
  use: last_verified changes only after the declared invocation actually runs.
  mutation: A reader never runs write variants; canonical writes require an active goal-scoped grant or an exact separate-action approval, and network writers retain their declared boundary.
  failure: Mark BROKEN or DEGRADED on the first reproducible failure and name the replacement or stop condition.
  retirement: Historical files remain searchable but cannot route a task.
  observer_copy: A machine-local codex_specs copy is independent observer evidence, never a Codex startup dependency or canonical execution path.

