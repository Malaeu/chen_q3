          changes.
        writes: false
        approval: NONE
        authority: >-
          LEXICAL_SOURCE_GRAPH_NOT_KERNEL_TRUTH. Edges are name occurrences in
          declaration bodies after comment stripping, not Lean environment
          dependencies. False edges are possible; short names are the known
          failure mode and are filtered by --min-name (default 4). The first
