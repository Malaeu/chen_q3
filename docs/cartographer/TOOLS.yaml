      Спуск по свойствам вместо имён. Отвечает на «что нужно, чтобы доказать X»
      и «что откроется, если докажу Y». Содержит детектор чеков и защиту от
      суррогата по форме.
    created: 2026-08-08
    why: >
      За один вечер схлопнул карту вчетверо (четыре обрыва -> два входа) и дважды
      поймал фальшивый READY в цепочке.

