  generator_and_skill_discovery:
    summary: Family registration covers task-specific helpers without pretending every historical generator is live.
    front_door: task-specific-generators
    coverage: [orchestrator/**/*.py, scripts/**/*.py, q3.lean.aristotle/scripts/**/*.py, specs_docs/**/*.sh, .agents/skills/**/SKILL.md, ~/.codex/skills/**/SKILL.md]
    selection_rule: A family match permits inspection, not execution. Read the task-local source, --help, write paths, and applicable skill before calling it.
    inventory_command: rg --files orchestrator scripts q3.lean.aristotle/scripts specs_docs .agents/skills
    codex_skills: Runtime skill registry is authoritative for availability; this manifest records only Q3 routing and hazards.
    tools:
