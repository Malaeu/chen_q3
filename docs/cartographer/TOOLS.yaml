  - id: zero-byte-sqlite-decoys
    status: BROKEN
    audience: [CODEX, CLAUDE_CODE, HUMAN]
    mode: READ_ONLY
    paths: [knowledge.db, orchestrator/knowledge.db, orchestrator/observability.db, orchestrator/state/observability.db, q3.lean.aristotle/aristotle_db/proofs.db]
