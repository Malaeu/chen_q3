# Q3/RH operational tool manifest.
# Policy lives in docs/CODEX_CONTROL.md. This file answers what exists,
# when it is used, what it writes, and where its result becomes durable.

schema: q3_tool_manifest.v2

meta:
  updated: 2026-09-02
  owner: OWNER
  canonical: docs/cartographer/TOOLS.yaml
  observer_copy: machine-local codex_specs/TOOLS.yaml if present
  observer_rule: NONAUTHORITATIVE_NOT_A_CODEX_STARTUP_DEPENDENCY
  repo: .
  canonical_branch: rh_clean
  policy: docs/CODEX_CONTROL.md
  session_router: q3.lean.aristotle/ACTIVE/SESSION_ENTRY.md
  generated_inventory: docs/TOOLS.md
  rule: An instrument absent from this manifest or its registered family is not routable.

status_semantics:
  values: [ENABLED, AVAILABLE, DEGRADED, DISCONNECTED, RETIRED, BROKEN, PLANNED]
  enabled: Verified and callable for the declared audience and mode.
  available: Callable, but outside the automatic Q3 contour.
  degraded: Callable with a named semantic or operational limitation.
  disconnected: Present on disk but not wired into the declared runtime.
  retired: Historical mechanism; never a live entry point.
  broken: Known reproducer fails; do not route.
  planned: Design only; no callable implementation exists.

mode_semantics:
  values: [READ_ONLY, WRITES_DERIVED, WRITES_CANONICAL, NETWORK_WRITE, EXTERNAL]
  read_only: May be used without a write authorization.
  writes_derived: Rebuilds non-authoritative projections or generated outputs.
  writes_canonical: Mutates tracked source, canonical project memory, or task state.
  network_write: Sends, publishes, downloads, or changes remote state.
  external: Belongs to another executor or runtime and is not a Codex startup input.

classification_semantics:
  values: [AUTOMATIC, MANUAL, DISPLAY_ONLY, RETIRED]
  automatic: Invoked by a registered workflow event or close transaction.
  manual: Callable only after its explicit trigger is satisfied.
  display_only: Reports state and cannot clear a gate.
  retired: Never routable in the production contour.

tool_contract:
  required_fields: [id, classification, status, audience, mode, path_or_paths, invocation, trigger, writes, approval, authority, records_to, last_verified]
  validation: last_verified is accepted only after the declared invocation or a task-specific plant succeeds.
  family_rule: Family coverage permits discovery only; it never inherits ENABLED status into an uninspected script.

startup_contract:
  order:
    - docs/CODEX_CONTROL.md
    - q3.lean.aristotle/ACTIVE/SESSION_ENTRY.md
    - python3 orchestrator/workflow_runtime.py plan
  manifest_read:
    runtime_validation: FULL_MANIFEST_BY_WORKFLOW_PLAN
    after_plan_on_task_match: [tool_families]
  cognitive_operator_read: ONLY_ON_MATHEMATICAL_STRATEGY_TRIGGER_AFTER_PLAN
  validation:
    command: python3 orchestrator/workflow_runtime.py plan
    checks: [control_v10_identity, one_read_epoch, physical_goal_or_current_task, exact_source_pin, scoped_node_registry, tool_contract_fields, own_foreign_dirty_split]
    writes: false
  prohibition:
    - CLAUDE.md is not a Codex startup input.
    - A generated view never overrides physical task state.
    - An ENABLED label without audience, trigger, mode, and write contract is invalid.
    - bash specs_docs/session_start.sh is a manual legacy diagnostic wrapper, not a second startup front door.

memory_event_routes:
  SESSION_START:
    read: [startup_contract, data_surfaces, known_hazards]
    run: [workflow-runtime]
    record: NONE

  GOAL_DISPATCH:
    condition: Before any physical goal dispatch or readiness to mint a source-locked next goal.
    run: [workflow-runtime]
    record: Canonical startup snapshot and read-only workflow plan; legacy selectors are display-only.

  THREE_BODY_CONTROL:
    condition: Manual validation of immutable historical Control-v9 quarantine, receipts, request lifecycle, or pinned wake evidence.
    run: [three-body-loop]
    record: NONE_IN_CONTROL_V10; historical schemas and receipts remain byte-bound and do not create native v10 authority.

  REGISTERED_CYCLE:
    condition: After one precommitted proof-cycle action has a result and before step-close.
    run: [workflow-close-node]
    record: The workflow transaction routes the attempt through its internal step-close writer; exact retry is idempotent.

  REUSABLE_INSIGHT:
    condition: A checked synthesis is reusable beyond the current attempt.
    run: [workflow-close-node]
    record: The workflow transaction routes the optional insight through its internal step-close writer; semantic duplicates are suppressed.

  ABSENCE_OR_NEW_OBJECT:
    condition: Before claiming absence, searching externally, or creating a replacement.
    run: [supplier-preflight]
    record: SEARCH_FLAGS in the artifact being produced anyway.

  LITERATURE_DISCOVERY:
    condition: A bounded query asks whether a theorem shape, characterization, translation, or alias exists in current publications.
    run: [literature-discovery]
    record: Read-only metadata receipt to stdout only; no card ownership or repository write. Durable q3_search_intent.v1 evidence remains a separate workflow-search-evidence route.

  THEOREM_SHAPE_FORK:
    condition: Branch selection, return to an old route, bisection, or strategy pivot.
    read: [docs/GENEALOGY.md, docs/Progress_Log.md, docs/RECORDING_RULES.md]
    run: [property-descent]
    record: One eight-field Progress_Log entry at selection time.
    durable_projection: journal_entry.kind=branch_decision at goal-close.

  EXTERNAL_VERDICT:
    condition: A route decision arrived from Proshka, Mythos, Claude, Aristotle, or another reviewer.
    record: Actor plus verbatim argument; a choice letter alone is invalid.

  ODDITY:
    condition: Unexpected numerical, structural, migration, startup, database, or tool observation.
    record: Observation, plausible readings, and the outcome that distinguishes them before explanation.

  NEGATIVE_CLOSE:
    condition: INCONCLUSIVE, WALL, or KILLED.
    record: Structured AUTOPSY lines and a kill row when the killed unit is reusable knowledge.

  EXPLORATION_CLOSE:
    run: [kb-canonical-write]
    record: One compact reviewed closeout; raw speculative cycles stay out of durable memory.

  GOAL_CLOSE:
    run: [workflow-close-node]
    record:
      - SEARCH_FLAGS and AUTOPSY from task artifacts.
      - Progress_Log branch decisions into knowledge.db.
      - Verdict lessons, sensors, semantic index, and derived Spine views.
    ordering: Route state is updated last.
    delivery: Under a GOAL_SCOPED_OPERATIONAL_GRANT, commit named paths, pull --rebase, and push before advancing.

  STEP_CLOSE:
    run: [knowledge-spine-step-close]
    require: [q3_goal_attempt.v1 payload]
    optional: [q3_goal_insight.v1 payload]
    record:
      - Attempt and optional insight events before any migration.
      - Verdict lessons, INSIGHTS.md, and Progress_Log.md into knowledge.db.
      - q3_docs only when its deterministic curated corpus hash changed.

  SEMANTIC_INDEX_REFRESH:
    run: [q3-docs-refresh, semantic-preflight]
    record: Machine-local receipt under q3.lean.aristotle/.qmd_cache/; tracked Mac snapshots are nonauthoritative.

  TOOL_BIRTH:
    condition: Before a new helper, generator, skill, hook, or database writer becomes routable.
    require: [audience, trigger, mode, invocation, writes, approval, authority, validation, records_to]

  TOOL_FAILURE:
    condition: A registered invocation has a reproducible failure.
    record: Mark BROKEN or DEGRADED immediately with reproducer and replacement; file existence is not ENABLED.

data_surfaces:
  branch_journal:
    path: docs/Progress_Log.md
    authority: CANONICAL_BRANCH_RATIONALE
    contains: Eight-field decisions, including rejected alternatives and external arguments.
    retrieval: [ask.sh, q3_docs, Spine recent decisions, knowledge.db branch_decision projection]

  genealogy:
    path: docs/GENEALOGY.md
    authority: REVIEWED_HISTORICAL_TOPOLOGY
    trigger: Branch choice, route return, bisection, or archaeology.

  recording_rules:
    path: docs/RECORDING_RULES.md
    authority: CANONICAL_RECORDING_FORMAT

  historical_stream:
    path: q3.lean.aristotle/docs/INSIGHTS.md
    authority: HISTORICAL_EVENT_STREAM
    rule: >-
      Immutable hash-sealed legacy region, then machine-only goal-event blocks. Never edit
      manually after the boundary; append only through goal_events.py record-insight.

  semantic_project_memory:
    path: q3.lean.aristotle/aristotle_db/knowledge.db
    authority: CANONICAL_PROJECT_SEMANTIC_MEMORY
    read_uri: file:q3.lean.aristotle/aristotle_db/knowledge.db?mode=ro
    owns: [kills, moves, reviewed_journal, branch_decisions, dossiers, search_flags]

  proof_artifact_registry:
    path: q3.lean.aristotle/aristotle_db/aristotle_proofs.db
    authority: METADATA_NOT_LEAN_TRUTH
    owns: [documents, lemmas, specifications, Aristotle provenance]

  observability_projection:
    path: q3.lean.aristotle/aristotle_db/observability.db
    authority: DERIVED_REGENERABLE_NOT_CANONICAL

  semantic_index:
    path: qmd://q3_docs/
    authority: RETRIEVAL_ONLY
    local_receipt: q3.lean.aristotle/.qmd_cache/semantic_index_receipt.json
    tracked_snapshot: orchestrator/state/SEMANTIC_INDEX_STATUS.json
    tracked_snapshot_authority: HISTORICAL_NONAUTHORITATIVE_CROSS_MACHINE_EVIDENCE

  scoped_node_registry:
    path: orchestrator/state/NODE_REGISTRY_V10.json
    authority: SCOPED_SEMANTIC_ADMISSION_LEDGER_NOT_LEAN_TRUTH
    schema: q3_node_registry.v10
    rule: Exact node, theorem, consumer and hypothesis-port edges are required before consumption.

tool_families:
  startup_and_control:
    summary: Read-only orientation and physical-state selection.
    front_door: workflow-runtime
    manual_legacy_wrapper: codex-session-start
    coverage: [specs_docs/session_start.sh, orchestrator/session_briefing.py, orchestrator/spine.py, orchestrator/three_body_loop.py, "**/routeb_status.py"]
    tools:
      - id: codex-session-start
        classification: MANUAL
        status: AVAILABLE
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: specs_docs/session_start.sh
        invoke: bash specs_docs/session_start.sh
        trigger: Manual legacy diagnostics only; never called by canonical Control-v10 startup.
        writes: false
        approval: NONE
        authority: LEGACY_DIAGNOSTIC_WRAPPER_NOT_STARTUP_AUTHORITY
        records_to: NONE
        last_verified: 2026-08-10

      - id: routeb-session-briefing
        classification: DISPLAY_ONLY
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/session_briefing.py
        invoke: python3 orchestrator/session_briefing.py brief
        alternatives:
          - python3 orchestrator/session_briefing.py validate
        trigger: Internal read-only Route B summary called once by codex-session-start.
        writes: false
        approval: NONE
        authority: DELTA_AWARE_ORIENTATION_NOT_GOAL_SELECTION_OR_VERDICT_AUTHORITY
        records_to: stdout
        validation: test_session_briefing; starts with q3_proof_loop.v1 battle brief, labels assembly rows as non-percentage bookkeeping, and never invents a joint under HOLD
        last_verified: 2026-09-01

      - id: roof-port-supplier-ledger
        classification: DISPLAY_ONLY
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/roof_port_ledger.py
        invoke: python3 orchestrator/roof_port_ledger.py
        trigger: Every Route B startup/runtime plan; reverse-audit the seven roof inputs under one CanonicalApproximation C.
        writes: false
        approval: NONE
        authority: SOURCE_LOCKED_DEPENDENT_PORT_AUDIT_NOT_MATHEMATICAL_VERDICT_OR_RH_CLAIM
        records_to: stdout and logical_plan.proof_loop.roof_port_ledger
        validation: test_session_briefing and test_workflow_runtime; current roof signature and audited axiom source blob must match HEAD
        last_verified: 2026-09-01

      - id: routeb-session-checkpoint
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_DERIVED
        path: orchestrator/session_briefing.py
        invoke: python3 orchestrator/session_briefing.py checkpoint
        trigger: Internal machine-local delta checkpoint after a clean workflow-session-close.
        writes: true
        approval: NONE_FOR_MACHINE_LOCAL_DERIVED_CHECKPOINT
        authority: DETERMINISTIC_NONCANONICAL_DELTA_BASELINE_NOT_ROUTE_STATE
        records_to: q3.lean.aristotle/.qmd_cache/session_briefing_checkpoint.json
        validation: test_session_briefing
        last_verified: 2026-08-30

      - id: research-debt-challenge
        classification: MANUAL
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/research_debt_challenge.py
        invoke: python3 orchestrator/research_debt_challenge.py rank
        alternatives:
          - python3 orchestrator/research_debt_challenge.py render --debt-id ID --request-id REQ-ID --boundary-id BOUNDARY-ID
          - python3 orchestrator/research_debt_challenge.py manifest --debt-id ID --request-id REQ-ID --boundary-id BOUNDARY-ID
        trigger: Owner selects preparation of one reopenable research-debt packet subtype.
        writes: false
        approval: NONE_TO_RANK_OR_RENDER; DISPATCH_REQUIRES_ACTIVE_CONTROL_EXPLORATION_REVIEW_ELIGIBILITY
        authority: PACKET_SUBTYPE_PREPARATION_ONLY_NOT_CALL_CLASS_NOT_DISPATCH_NOT_VERDICT_NOT_ROUTE_REOPEN
        records_to: stdout
        validation: test_research_debt_challenge
        last_verified: 2026-08-30

      - id: research-dependency-gate
        classification: MANUAL
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/research_dependency_gate.py
        invoke: python3 orchestrator/research_dependency_gate.py check
        alternatives:
          - python3 orchestrator/research_dependency_gate.py plants
        trigger: Through the Control-v10 workflow plan or directly after changes to any active dependency surface, generator, registry, prompt, skill, or semantic-source selection.
        writes: false
        approval: NONE
        authority: CONSUMER_FIRST_DEPENDENCY_AND_EPISTEMIC_CLASSIFICATION_GATE
        records_to: stdout
        validation: test_research_dependency_contract + test_rigid_dependency_scan + test_research_dependency_p9_wiring; lifecycle-aware contextual scan covers active controls and source generators.
        last_verified: 2026-08-30

      - id: knowledge-spine-strict
        classification: DISPLAY_ONLY
        status: AVAILABLE
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/spine.py
        invoke: python3 orchestrator/spine.py --strict --stdout --reason session-start
        trigger: Manual compatibility diagnostic; canonical v10 startup uses workflow-runtime.
        writes: false
        approval: NONE
        authority: DERIVED_CONTROL_AND_MEMORY_VIEW
        records_to: stdout
        last_verified: 2026-08-10

      - id: knowledge-spine-goal-close
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_CANONICAL
        path: orchestrator/spine.py
        invoke: python3 orchestrator/spine.py --refresh --reason goal-close
        trigger: Closed goal after exact artifact validation.
        writes: true
        approval: TASK_SCOPE_MUST_ALREADY_AUTHORIZE_GOAL_CLOSE_WRITES
        authority: REGISTERED_GOAL_CLOSE_TRANSACTION_AND_DERIVED_VIEWS
        records_to: [knowledge.db, aristotle_proofs.db, inventory_RouteB.json, atoms_RouteB.json, observability.db, q3_docs, SPINE_STATE.json, SPINE_VIEW.md, META_CORPUS.json]
        last_verified: 2026-08-09

      - id: knowledge-spine-step-close
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX]
        mode: WRITES_CANONICAL
        path: orchestrator/spine.py
        invoke: >-
          python3 orchestrator/spine.py --refresh --reason step-close
          --attempt-payload <q3_goal_attempt.v1.json>
        alternatives:
          - >-
            python3 orchestrator/spine.py --refresh --reason step-close
            --attempt-payload <q3_goal_attempt.v1.json>
            --insight-payload <q3_goal_insight.v1.json>
        trigger: Completed registered cycle or reusable insight before the goal itself closes.
        writes: true
        approval: ACTIVE_GOAL_RUN_WRITE_SCOPE
        authority: EVENT_SCOPED_MIGRATION_AND_CONDITIONAL_SEMANTIC_REFRESH
        records_to: [knowledge.db, qmd://q3_docs/, q3.lean.aristotle/.qmd_cache/semantic_index_receipt.json]
        last_verified: 2026-08-13

      - id: migration-census
        classification: MANUAL
        status: ENABLED
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: orchestrator/migration_census.py
        invoke: python3 orchestrator/migration_census.py --strict
        trigger: Before and after knowledge migration; mandatory inside goal-close.
        writes: false
        approval: NONE
        authority: LIVE_SOURCE_TO_DATABASE_IDENTITY_CENSUS_WITH_UNMIGRATED_AND_STALE_ROWS
        records_to: stdout
        last_verified: 2026-08-13

      - id: routeb-status
        classification: DISPLAY_ONLY
        status: AVAILABLE
        audience: [CODEX, CLAUDE_CODE, HUMAN]
        mode: READ_ONLY
        path: q3.lean.aristotle/ACTIVE/requests/routeB_twolevel_spectral_ladder/routeb_status.py
        invoke: python3 q3.lean.aristotle/ACTIVE/requests/routeB_twolevel_spectral_ladder/routeb_status.py --check
        trigger: Manual explicit route/state discrepancy diagnostic only; canonical Control-v10 plan performs this check internally and never calls this executable.
        writes: false
        approval: NONE
        authority: MANUAL_DIAGNOSTIC_ONLY_NOT_PRODUCTION_V10_SELECTOR_NOT_PROOF
        records_to: stdout
        last_verified: 2026-08-10

      - id: goal-run-selector
        classification: DISPLAY_ONLY
        status: AVAILABLE
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/goal_runtime.py
        invoke: python3 orchestrator/goal_runtime.py --json
        alternatives:
          - python3 orchestrator/goal_runtime.py --selftest
          - Python API validate_runtime_state(..., grant_resolver=<authority>)
        trigger: Explicit legacy-v9 maintenance or standalone diagnostics only; canonical Control-v10 plan selects through startup_runtime exactly once.
        writes: false
        approval: NONE
        authority: LEGACY_V9_MAINTENANCE_SELECTOR_NOT_PRODUCTION_V10_AUTHORITY
        records_to: stdout
        last_verified: 2026-08-13

      - id: workflow-runtime
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        paths: [orchestrator/workflow_runtime.py, orchestrator/startup_runtime.py, orchestrator/routeb_goal_state.py, orchestrator/node_registry_v10.py, orchestrator/lean_dependency_runtime.py, orchestrator/proof_loop.py, orchestrator/roof_port_ledger.py]
        invoke: python3 orchestrator/workflow_runtime.py plan
        alternatives:
          - >-
            python3 orchestrator/workflow_runtime.py review-plan
            --attachment <request.txt> --request-commit <commit>
            --request-id <request-id> --boundary-id <boundary-id>
            --expected-sha256 <sha256>
        trigger: >-
          One stateless lifecycle plan or byte-exact same-chat review dispatch plan.
          Review dispatch requires one canonical CALL_CLASS; an
          EXPLORATION_REVIEW also requires the live bounded-exploration gate.
        writes: false
        approval: NONE
        authority: STATELESS_READ_ONLY_PLANNER_NOT_SELECTOR_POLICY_KERNEL_MATHEMATICAL_AUTHOR_OR_GIT_DELIVERY
        records_to: stdout plan or review-dispatch plan
        validation: >-
          test_workflow_runtime including the internal scoped
          node_registry_v10 startup/consumption gate, startup-red, owned-scope, event,
          command-failure, review-plan byte-binding, CALL_CLASS and
          EXPLORATION_REVIEW eligibility, consumer-first supplier receipt,
          queue-lifecycle, duplicate-dispatch plants, and the additive
          logical_plan.proof_loop q3_proof_loop.v1 operating card with the
          source-locked q3_roof_port_supplier_ledger.v1 reverse ledger.
        last_verified: 2026-09-01

      - id: workflow-close-node
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: WRITES_CANONICAL
        path: orchestrator/workflow_runtime.py
        invoke: python3 orchestrator/workflow_runtime.py run --through close-node
        trigger: Execute one already-selected exact node/theorem/consumer edge through its registered close-node writers.
        writes: true
        approval: ACTIVE_GOAL_RUN_AND_EXACT_OWNED_PATHS
        authority: SCOPED_LIFECYCLE_EXECUTOR_NOT_SELECTOR_POLICY_KERNEL_MATHEMATICAL_AUTHOR_OR_GIT_DELIVERY
        records_to: stdout receipt plus outputs of the explicitly selected registered writers
        validation: test_workflow_runtime including writer epoch, exact edge, consumer-first supplier receipt, kernel gate, command failure and close-node plants
        last_verified: 2026-09-02

      - id: workflow-search-evidence
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: WRITES_CANONICAL
        paths: [orchestrator/workflow_runtime.py, scripts/supplier_preflight.py, q3.lean.aristotle/scripts/oracle_questions.py]
        invoke: >-
          python3 orchestrator/workflow_runtime.py run --through supplier-preflight
          --search-intent <q3_search_intent.v1.json> --record-evidence
          --oracle-card <existing-card.md> --owned-path <existing-card.md>
        trigger: >-
          Persist one validated SearchIntent observation after the canonical
          runtime binds the physical goal, exact consumer scope and owner path.
        writes: true
        approval: ACTIVE_GOAL_RUN_AND_EXACT_ORACLE_CARD_OWNERSHIP
        authority: SCOPED_SEARCH_EVIDENCE_WRITER_NOT_DISCOVERY_PROOF_ADMISSION_OR_GIT_DELIVERY
        records_to: one existing owned oracle card through the canonical locked writer
        validation: test_workflow_runtime and test_oracle_search_evidence writer ownership, lock, receipt and mutation plants
        last_verified: 2026-09-02

      - id: workflow-session-close
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: WRITES_DERIVED
        path: specs_docs/session_close.py
        invoke: python3 orchestrator/workflow_runtime.py close-session
        trigger: Incremental session close after scoped work.
        writes: true
        approval: EXACT_OWNED_PATHS_AND_OPTIONAL_PROTOCOL_OUTPUT
        authority: DERIVED_REPAIR_KERNEL_CHECK_AND_CLOSE_SKELETON_NOT_GIT_DELIVERY
        records_to: optional explicit protocol path and registered derived outputs
        validation: test_session_close
        last_verified: 2026-08-29

      - id: workflow-phase-close
        classification: AUTOMATIC
        status: ENABLED
        audience: [CODEX, HUMAN]
        mode: WRITES_CANONICAL
        path: specs_docs/phase_close.py
        invoke: python3 orchestrator/workflow_runtime.py close-phase
        trigger: Phase transition after node closure.
        writes: true
        approval: EXACT_PHASE_SCOPE
        authority: GATE_ORCHESTRATION_VERDICT_MIGRATION_BLUEPRINT_REGENERATION_AND_DEBT_VISIBILITY_NOT_SEMANTIC_JUDGMENT
        records_to: stdout or explicit JSON receipt plus knowledge.db and registered derived outputs
        validation: test_phase_close
        last_verified: 2026-08-29

      - id: three-body-loop
        classification: MANUAL
        status: AVAILABLE
        audience: [CODEX, HUMAN]
        mode: READ_ONLY
        path: orchestrator/three_body_loop.py
        invoke: python3 orchestrator/three_body_loop.py validate
        alternatives:
          - python3 orchestrator/three_body_loop.py request-validate <CODEX_REQ.md>
          - Q3_CONTROL_V9_MAC_TRACKED_RECEIPT_FALLBACK=1 python3 orchestrator/three_body_loop.py validate
        trigger: >-
          Manual compatibility validation of immutable Control-v9 quarantine,
          signed-offline receipts, exact historical owner-waiver pairings,
          request CAS evidence, or pinned wake evidence. It is never called by
          the canonical Control-v10 startup or admission path.
        writes: false
        approval: NONE_FOR_MANUAL_HISTORICAL_VALIDATION; NO_NATIVE_V10_ADMISSION
        authority: HISTORICAL_V9_COMPATIBILITY_VALIDATOR_NOT_ACTIVE_CONTROL_NOT_NATIVE_V10_ADMISSION
        records_to: stdout
        validation: >-
          test_signed_offline_semantic_attestation covers the signed primary,
          explicit Darwin fallback, tracked revocations, symlink rejection,
          both exact owner-waiver pairings, cross-pair rejection, and
          fail-closed boundaries, plus all original immutable control-v9,
          crash, mutation, broker, and goal-runtime plants. Native v10
          admission is explicitly out of scope.
        last_verified: 2026-08-31

      - id: w5-budget-probe
        classification: MANUAL
        status: ENABLED
        audience: [HUMAN, CLAUDE_CODE, CODEX]
        mode: READ_ONLY
        path: scripts/w5_budget_probe.py
        invoke: python3 scripts/w5_budget_probe.py --steps 800
        alternatives:
          - python3 scripts/w5_budget_probe.py --wrong-way
        trigger: A growth claim about a W5 budget component needs reproducing or refuting.
        writes: false
        approval: NONE
        authority: >-
          DIAGNOSTIC_NUMERICS_ONLY_NEVER_A_PROOF_AND_NEVER_A_LEAN_INPUT
