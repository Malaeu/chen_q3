        alternatives:
          - python3 scripts/supplier_preflight.py --query "<terms>"
        trigger: ABSENCE_OR_NEW_OBJECT and immediately after an exact goal target is understood.
        writes: false
        approval: NONE
        authority: COMPLETE_SHELF_PROPERTIES_AND_DIRECT_LOCAL_LEAN_TYPE_FIT
        records_to: stdout
        outcomes: [CANDIDATE_ONLY, EXACT_FIT, REJECTED, FOREIGN_UNVERIFIED, COMPLETE_ABSENCE, INCOMPLETE]
        failure_mode: >-
          Stale or incomplete env_index, any unresolved enabled external base, a failed shelf
          layer, ambiguous declaration, or comparator timeout yields INCOMPLETE. The tool never
          launches envdump implicitly; it prints the exact regeneration command. Exact absence
          also requires a miss in Lean core, every local dependency package, and the full Q3 source tree; a source-only
          declaration remains CANDIDATE_ONLY rather than being promoted without EnvDump properties.
          COMPLETE_ABSENCE additionally requires a precise SOURCE_DECLARED candidate and
          SOURCE_DECLARATION_ABSENCE across the fresh local environment/source closure and
          every enabled external base. Omitted, unknown, or GENERATED_OR_DERIVED provenance
          yields INCOMPLETE because source-text absence cannot exclude elaborator-generated
          declarations. COMPLETE_ABSENCE may support a later creation decision but never
          current consumption; only EXACT_FIT clears the exact-fit reuse gate.
