cartographer:
  - name: inventory.py
    status: ENABLED
    path: codex_specs/cartographer/inventory.py
    call: "python3 inventory.py --scope RouteB"
    out: inventory_RouteB.json
    what: "1174 объекта RouteB с сигнатурами, детерминированно, агентов не запускает"
    note: >
      Регулярка правилась 07.08 — раньше не видела private/protected/noncomputable
      и атрибуты @[...], давала 618 вместо 1174.

  - name: atoms.py
    status: ENABLED
    path: codex_specs/cartographer/atoms.py
    call: "python3 atoms.py atoms.json"
    out: atoms_RouteB.json
    runtime: "~10 сек, печатает прогресс"
    what: >
      Внешние атомы: леммы, которые вызываются в доказательствах, но определены
      НЕ в проекте. 1899 атомов на 08.08 (было 1513 днём — ночная работа дала +386).

  - name: cheap.py
    status: ENABLED
    path: codex_specs/cartographer/cheap.py
    call: "python3 cheap.py"
    out: "очередь незакрытых шагов по цене + списки объявлений Mathlib"
    created: 2026-08-08
    what: >
      cheap-closure-finder: сортирует незакрытые шаги assembly по ЦЕНЕ закрытия,
      а не по номеру. Шесть пород: ПОТЕРЯННОЕ ИМЯ / СВОЙ ФАКТ / ПЕРЕХОДНИК /
      ПЕРЕНОС МАШИНЫ / ПОДЪЁМ ИЗМЕРЕНИЯ / НЕНАЙДЕННЫЙ. Для дешёвых печатает ВСЕ
      объявления релевантного файла Mathlib — поиск по имени промахивается.
    accuracy: "2026-08-08: 8 из 10 строго совпали с ручным разбором, 2 уточнены в пользу скрипта"
    input: "требует поля assembly.objects — список Lean-имён, которые шаг затрагивает,\n      ВКЛЮЧАЯ требуемые, но несуществующие. Без него порода не определяется."
    limits: >
      Шагов не закрывает. Кандидат становится закрытием только после прогона Lean.
      Отсев ложных совпадений по слову (genEigenspace != пучок K,G) не
      автоматизирован — печатает предупреждение, читает человек.
      Существование в Mathlib проверяется rg по диску, НЕ по таблице atom:
      atom знает лишь уже используемое, новая лемма выглядела бы несуществующей.

  - name: brief.py
    status: ENABLED
    path: codex_specs/cartographer/brief.py
    call: "python3 brief.py [ПРЕФИКС_ЦЕПОЧКИ] [--out файл.md]"
    created: 2026-08-08
    what: >
      Source-locked пакет из базы для Прошки/Codex: сводка цепочек, закрытые шаги
      со ссылками file:line, незакрытые с породой/объектами/последней заметкой,
      несущие атомы, команда самопроверки.
    output: "все цепочки — 16 КБ / 145 строк (09.08); одна цепочка — ~7 КБ"
    fixed: >
      2026-08-09: парсер --out брал значение флага как позиционный аргумент,
      генератор искал цепочку с именем-путём. Теперь флаг и значение вырезаются
      вместе: argv[:i] + argv[i+2:].
    vs_proshka_brief: >
      Их proshka-brief собирает ЧТО ИЗМЕНИЛОСЬ (коммиты, диффы за период).
      Наш brief.py — ЧТО СУЩЕСТВУЕТ И НА ЧЁМ СТОИТ (граф состояния).
      Не заменяют друг друга.

  - name: load_capability.py
    status: ENABLED
    path: codex_specs/cartographer/load_capability.py
    what: "линзы L1..L8 из L*.md в таблицу capability, идемпотентно"

  - name: load_switches.py
    status: ENABLED
    path: codex_specs/cartographer/load_switches.py
    what: "not_proves + fails_if — отрицательные переключатели"

  - name: load_assembly.py
    status: ENABLED
    path: codex_specs/cartographer/load_assembly.py
    what: "цепочки сборки: требование -> откуда взять -> статус"

