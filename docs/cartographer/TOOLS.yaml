# Реестр инструментов Q3/RH
#
# Один файл — полная картина: что включено, что нет, почему.
# Правило: инструмент без записи здесь считается НЕ СУЩЕСТВУЮЩИМ.
# Проверено фактически 2026-08-08 (ls, запуск, регистрация в Claude Code).
#
# status: ENABLED     работает и подключён, можно звать прямо сейчас
#         AVAILABLE   работает, но не в нашем контуре — звать осознанно
#         RETIRED     снят намеренно, файл переименован в RETIRED*
#         BROKEN      существует, но не работает — указана поломка
#         PLANNED     решено сделать, ещё не сделано

meta:
  updated: 2026-08-08
  owner: Ылша
  repo: /Users/emalam/GitHub/rh_lean_01_2026
