# Как подключить новую базу
#
#   1. склонировать рядом с остальными
#   2. добавить запись сюда: id, origin, paths (Linux и Mac), license, что там полезного
#   3. python3 docs/cartographer/atom_describe.py --bases --selftest   ← проверит доступность
#   4. записать в TOOLS.yaml, если появился новый способ вызова
#
# Запись без `verified_by` считается непроверенной: строка «там есть X» без найденного
# file:line — это утверждение, а не факт.
