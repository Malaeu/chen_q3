# Реестр внешних Lean-баз, по которым картограф ищет готовое.
#
# ЗАЧЕМ. Правило проекта — не переписывать то, что уже доказано. Наше дерево картограф
# знает; чужие Lean-базы до 2026-08-12 подключались одним аргументом `--foreign <путь>`,
# захардкоженным в манифесте. Такой путь верен ровно на одной машине и молча ничего не
# находит на другой.
#
# Реестр решает три вещи: базы подключаются как плагины, путь ищется среди кандидатов (Linux
# и Mac держат репозитории в разных местах), и у каждой записаны лицензия и границы.
#
# ЧТО ЭТО НЕ ДЕЛАЕТ. Не скачивает и не обновляет базы: `origin` дан, чтобы второе тело
# подтянуло само. Не разрешает копировать код — см. `license` у каждой записи.
#
# ВАЖНОЕ РАЗЛИЧЕНИЕ. Здесь только базы **Lean-кода**. Источники-статьи (CCM, Suzuki,
# Yoshida) живут в `docs/routeB_bus/litreview/` и ищутся иначе: у них нет деклараций, у
# них есть теоремы на бумаге. Смешивать нельзя — теорема из статьи не компилируется.

schema: q3_lean_bases.v1
updated: 2026-08-12

bases:
  - id: zeta23
    name: Anthropic — «More than two thirds of the zeros … lie on the critical line»
    origin: https://github.com/anthropics/zeta-23-lean.git
    pin:
      head: 3635e74
      checked_clean: true
    paths:
      - /mnt/hdd01/Soft/GitHub/zeta-23-lean          # Linux, тело наблюдателя
      - ~/GitHub/zeta-23-lean                        # Mac, подтянуть по origin
    enabled: true

    # РАЗДЕЛЕНО 2026-08-12 после ревью Codex (HIGH-9). Прежняя запись выдавала нашу
    # внутреннюю строгость за требование Apache-2.0. Это разные вещи, и путать их
    # нельзя: одно можно нарушить юридически, другое — только процедурно.
    license: Apache-2.0
    license_obligations: >-
      Что требует сама Apache-2.0 при распространении производного: сохранить
      уведомление об авторских правах, приложить копию лицензии, сохранить файл
      NOTICE и обозначить внесённые изменения.
    project_attribution_policy: >-
      Наше собственное правило, строже лицензии: заимствованная ИДЕЯ отмечается в
      докстринге с указанием происхождения, даже когда код не копируется. Введено
      после переноса приёма «считать инерцией вместо локализации».

    toolchain: leanprover/lean4:v4.33.0-rc2
    derived_from: >-
      Их собственный NOTICE: продукт содержит производное от PrimeNumberTheoremAnd
      (github.com/AlexKontorovich/PrimeNumberTheoremAnd), тоже Apache-2.0.
    note: >-
      Ноль объявлений axiom, sorry только в файлах-заявках comparator. Полезна слоем
      LinAlg: posIndex, Sylvester, Weyl, VonNeumann, RankTrace — приём «считать инерцией
      вместо локализации». Оттуда взята половина переформулировки hsimple.
    good_for: [inertia, posIndex, rank_trace, Sylvester, Weyl, von_Neumann, comparator]
    verified: 2026-08-12
    verified_by: >-
      найдены posIndex PosIndex.lean:41 · rank_trace_ineq RankTrace.lean:163 ·
      finrank_le_posIndex_of_posDefOn Sylvester.lean:82 · hermPosPart :148 ·
      vonNeumann_trace_ineq :171 · лицензия и toolchain прочитаны с диска

