name = "q3_lean_aristotle"
version = "0.1.0"
defaultTargets = ["Q3"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

[[lean_lib]]
name = "Q3"
globs = ["Q3"]

[[lean_lib]]
name = "aristotle_output"
roots = ["aristotle_output"]

# A3_FLOOR standalone files in root (dependency chain: v22 → v20, v19)
[[lean_lib]]
name = "A3_FLOOR_v19_monotonicity"
globs = ["A3_FLOOR_v19_monotonicity.lean"]

[[lean_lib]]
name = "A3_FLOOR_v20_bounds_core"
globs = ["A3_FLOOR_v20_bounds_core.lean"]

[[lean_lib]]
name = "A3_FLOOR_v22_stage4_floor"
globs = ["A3_FLOOR_v22_stage4_floor.lean"]
