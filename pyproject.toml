[project]
name = "chen-q3"
version = "0.1.0"
description = "Q3 Spectral Analysis - Riemann Hypothesis Research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "rich>=13.0",
    "python-flint>=0.8.0",
    # Объявлен 2026-08-12 по находке HIGH-7 ревью Codex. Пять инструментов уже читали
    # YAML — spine.py (стартовый контракт Codex), tools_census.py, два мигратора базы и
    # atom_describe.py, — а зависимость не была записана нигде. На этой машине пакет
    # стоял, поэтому дефект не проявлялся; на чистой второй машине падает импорт.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "orchestrator/tests",
    "docs/cartographer/lean_env",
]
python_files = ["test_*.py"]
